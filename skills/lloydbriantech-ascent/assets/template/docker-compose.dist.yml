# <<PROJECT_TITLE>> — distribution compose configuration.
#
# Standalone distribution package for environments without CI/CD.
# Usage: $(ENGINE) compose -f docker-compose.dist.yml up -d
#
# This file is self-contained — it does NOT extend docker-compose.yml.
# All images are pre-built and tagged; no build step required.
# Suitable for air-gapped, offline, or edge deployments.
#
# All resources carry labels: project=<<PROJECT_LABEL>> (Principle 9).

services:
  backend:
    image: <<IMAGE_PROD>>-backend
    container_name: <<CONTAINER_PROD>>-backend
    labels:
      project: <<PROJECT_LABEL>>
    ports:
      - "3001:3001"
    environment:
      - <<INSIDE_CONTAINER_MARKER>>=1
      - <<ENV_PREFIX>>_NODE_ENV=production
      - <<ENV_PREFIX>>_LOG_LEVEL=info
      - <<ENV_PREFIX>>_PORT=3001
      - <<ENV_PREFIX>>_HOST=0.0.0.0
      - <<ENV_PREFIX>>_DB_URL=file:./data/<<PROJECT_SLUG>>.sqlite
    env_file:
      - .env
    volumes:
      - <<VOLUME_DATA>>:/app/data
    networks:
      - <<NETWORK_NAME>>
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: <<CONTAINER_PROD>>-nginx
    labels:
      project: <<PROJECT_LABEL>>
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dist.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - <<NETWORK_NAME>>
    depends_on:
      backend:
        condition: service_healthy
    restart: always

networks:
  <<NETWORK_NAME>>:
    name: <<NETWORK_NAME>>
    labels:
      project: <<PROJECT_LABEL>>

volumes:
  <<VOLUME_DATA>>:
    name: <<VOLUME_DATA>>
    labels:
      project: <<PROJECT_LABEL>>
