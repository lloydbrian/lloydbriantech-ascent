# <<PROJECT_TITLE>> — development nginx configuration.
#
# Reverse proxy routing:
#   /api/*     → backend:3001  (Express API server)
#   /healthz   → backend:3001  (liveness check, unauthenticated)
#   /readyz    → backend:3001  (readiness check, unauthenticated)
#   /*         → frontend:3000 (Vite dev server with HMR websocket)

upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # API routes → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints → backend (unauthenticated, fast)
    location /healthz {
        proxy_pass http://backend;
    }

    location /readyz {
        proxy_pass http://backend;
    }

    # Everything else → frontend (Vite dev server with HMR)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
