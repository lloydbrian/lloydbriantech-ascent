# <<PROJECT_TITLE>> — distribution nginx configuration.
#
# Used with docker-compose.dist.yml for standalone deployments.
# Functionally identical to nginx.prod.conf at scaffold time.
#
# This file exists as a separate config to support divergence for
# air-gapped, edge, or offline environments where the production
# config's assumptions (upstream TLS, ALB, etc.) may not hold.
# Customize this file for the distribution target; leave nginx.prod.conf
# for the primary production path.

upstream backend {
    server backend:3001;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /healthz {
        proxy_pass http://backend;
    }

    location /readyz {
        proxy_pass http://backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
