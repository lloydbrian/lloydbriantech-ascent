# <<PROJECT_TITLE>> — production nginx configuration.
#
# Serves pre-built frontend static files from /usr/share/nginx/html.
# Proxies /api/* and health endpoints to the backend service.
# No Vite dev server; no HMR websocket.
#
# Security headers and caching are production-appropriate defaults.
# TLS termination happens upstream (ALB, Cloudfront, or the orchestrator).

upstream backend {
    server backend:3001;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend assets (pre-built bundle)
    root /usr/share/nginx/html;
    index index.html;

    # API routes → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health endpoints → backend (unauthenticated, fast)
    location /healthz {
        proxy_pass http://backend;
    }

    location /readyz {
        proxy_pass http://backend;
    }

    # SPA fallback — serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames from Vite build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to dotfiles (except .well-known for ACME/LetsEncrypt)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
