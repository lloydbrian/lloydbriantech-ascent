version: 1

governance:
  environments: [local, beta, prod]     # the ladder, lowest first
  floors:
    local:
      checks: [ascent-security/check-env, delivery/gate]
    beta:
      checks: [ascent-security/check-dependencies, ascent-security/check-threat-model,
               ascent-ux/check-flow-integrity, ascent-docs/check-docs]
      reviews: { sec-posture: 30, ux-review: 60 }
    prod:
      checks: [ascent-delivery/check-acceptance, ascent-ops/check-drills,
               ascent-quality/check-test-evidence, ascent-adr/check-adrs]
      reviews: { architecture-review: 90, ops-review: 90, quality-review: 90 }
      sign_off: true
  approvers: [ana-lopez]
  ai_tier_dir: docs/governance/ai-tier/
  review_log: docs/governance/review-log.md
  launch_dir: docs/governance/launches/
  waivers: []

delivery:
  gate: "true"

ux:
  pages: ["app/public/**/*.html"]

ai:
  applications:
  - name: support-assistant
    root: .
