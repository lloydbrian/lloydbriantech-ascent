<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture page</title>
  <style>
    :focus-visible { outline: 3px solid #0a58ca; }
    main:focus { outline: none; }
  </style>
</head>
<body>
  <!-- <img src="commented-out.png"> must be ignored -->
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" tabindex="-1">
    <h1>Fixture</h1>
    <h2 id="photos">Photos</h2>
    <img src="court.jpg" alt="Court 3 at sunset">
    <img src="divider.svg" alt="">
    <h3>Form</h3>
    <form>
      <label for="email">Email</label>
      <input id="email" type="email">
      <label>Name <input type="text" name="name"></label>
      <input type="text" aria-label="Search">
      <select aria-labelledby="photos"><option>One</option></select>
      <input type="hidden" name="token" value="x">
      <textarea id="note" title="Note"></textarea>
      <button type="submit">Send</button>
      <button type="button" aria-label="Close dialog"><svg aria-hidden="true"></svg></button>
      <a href="/home"><img src="logo.svg" alt="Home"></a>
    </form>
    <video src="clip.mp4" autoplay muted controls></video>
    <div role="button" tabindex="0" onclick="go()" onkeydown="go()">Go</div>
  </main>
  <script>const fake = "<img src=x>";</script>
</body>
</html>
