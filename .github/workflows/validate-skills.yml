# Skill validation workflow
#
# Runs on every PR and push to main. Jobs:
#   - structure-check: required framework files and ADR-001..007 exist
#   - link-check:      internal markdown links resolve
#   - gate:            on ubuntu-latest and macos-latest (ADR-008)
#       make qa            frontmatter (incl. trigger-first descriptions),
#                          links, template placeholders
#       make test-skills   renders the template, runs all 28 skill tests
#       make test-plugins  plugin drift, names, read-only agents (ADR-009);
#                          'claude plugin validate' runs locally, SKIPs in CI
#   - mutant-groups:   lists the negative-control groups (make test-mutants-groups)
#   - harness:         the two make test-harness self-tests, per platform: each gate
#                      section alone matches the full gate, parallel runs match serial (ADR-018)
#   - mutants:         one job per group and platform, in parallel:
#       make test-mutants GROUP=<group>  named negative controls; any survivor fails.
#       Fast mode on pull requests and pushes; full mode weekly and on request
#
# Not yet checked here: INTENT-MAP phrase sync (review responsibility),
# eval scenarios (Phase 5).

name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full-mode run of every negative control (ADR-018): fast mode is kept
  # honest by its guards, and this catches anything they miss.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Negative-control mode (fast or full)
        type: choice
        options: [fast, full]
        default: fast

# Least privilege: these jobs only read the repository (F34).
permissions:
  contents: read

jobs:
  structure-check:
    name: Repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Confirm required files exist
        run: |
          set -euo pipefail
          required=(
            README.md
            CLAUDE.md
            CHANGELOG.md
            CONTRIBUTING.md
            LICENSE
            LICENSE-MIT
            LICENSE-APACHE
            .gitignore
            .editorconfig
            docs/framework/PRINCIPLES.md
            docs/framework/PHILOSOPHY.md
            docs/framework/SCOPE.md
            docs/framework/ROADMAP.md
            docs/framework/ARCHITECTURE.md
            docs/framework/DECISIONS/INDEX.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "  ✗ missing: $f"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "✗ Repository structure check failed: $missing required files missing"
            exit 1
          fi
          echo "✓ All required Phase 0 files present"

      - name: Confirm ADR-001 through ADR-007 exist
        run: |
          set -euo pipefail
          for n in 001 002 003 004 005 006 007; do
            count=$(ls docs/framework/DECISIONS/ADR-${n}-*.md 2>/dev/null | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "  ✗ ADR-${n}: expected exactly 1 file, found ${count}"
              exit 1
            fi
          done
          echo "✓ All Phase 0 ADRs present"

  link-check:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify internal Markdown links resolve
        run: |
          set -euo pipefail
          # Extract all relative Markdown links and verify each target exists.
          # Skips external (http://, https://) links — those are checked by a
          # separate workflow that runs on cron, not on every PR.
          broken=0
          while IFS=: read -r file link; do
            # Strip anchors (#section); link target is everything before #
            target="${link%%#*}"
            [ -z "$target" ] && continue
            # Resolve target relative to file's directory
            dir="$(dirname "$file")"
            resolved="$dir/$target"
            if [ ! -e "$resolved" ]; then
              echo "  ✗ $file → $link (resolved as $resolved)"
              broken=$((broken+1))
            fi
          done < <(
            grep -rEon '\]\(([^)]+)\)' --include='*.md' . 2>/dev/null \
              | sed -E 's|^([^:]+):[0-9]+:\]\(([^)]+)\).*|\1:\2|' \
              | grep -v 'http://\|https://\|mailto:' || true
          )
          if [ "$broken" -gt 0 ]; then
            echo ""
            echo "✗ $broken broken internal links"
            exit 1
          fi
          echo "✓ All internal links resolve"

  gate:
    # The framework's own gate on both platforms ASCENT supports (ADR-008):
    # validators, all 28 embedded-skill tests on a rendered template, and the
    # plugin gate. The negative controls run in the mutants jobs below.
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validators
        run: make qa

      - name: Embedded-skill tests
        run: make test-skills

      - name: Plugin gate
        run: make test-plugins

  harness:
    # The harness's slow self-tests (ADR-018): fast mode runs one gate section at
    # a time, which is sound only while the sections are independent, and runs
    # controls in parallel, which must report exactly what a serial run reports.
    # Together they take about 15 minutes locally, so they run as separate jobs;
    # macOS runners are slower and have 3 cores, hence 45 minutes.
    name: Harness self-test (${{ matrix.os }}, ${{ matrix.test }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test: [test-gate-sections, test-mutants-harness]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Harness self-test
        env:
          TEST: ${{ matrix.test }}
        run: bash "tests/meta/$TEST.sh"

  mutant-groups:
    # The group list comes from make/test-mutants.sh itself, so a new plugin's
    # controls get their own job without a change to this file.
    name: Mutant groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: List groups
        id: list
        run: echo "groups=$(make --no-print-directory test-mutants-groups)" >> "$GITHUB_OUTPUT"

  mutants:
    # Named negative controls, one job per group and platform (ADR-008).
    # Fast mode (ADR-018) on pull requests and pushes, 15 minutes: four CI runs
    # on PR #62 and main showed every macOS group under 10 (ADR-017 decision 5).
    # Full mode, weekly and on request, takes up to about 50 s a control on
    # macOS, hence 40 minutes. The condition is MODE's, below.
    name: Negative controls (${{ matrix.os }}, ${{ matrix.group }})
    needs: mutant-groups
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && 40 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: ${{ fromJSON(needs.mutant-groups.outputs.groups) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Negative controls
        env:
          GROUP: ${{ matrix.group }}
          MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && 'full' || 'fast' }}
        run: make test-mutants GROUP="$GROUP" MODE="$MODE"
