# example-service on one container host (blueprint operable-service).
# Every image is pinned; the api reads its secrets at start, never from this file.
services:
  proxy:
    image: docker.io/library/nginx:1.27.2-alpine
    ports:
      - "443:8443"
    depends_on:
      - api
  api:
    image: registry.example/example-service-api:1.0.0
    environment:
      APP_ENV: prod
      CONFIG_PATH: /example-service/prod/
      DB_SECRET_ID: example-service/prod/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/-/health"]
      interval: 15s
  db:
    image: docker.io/library/postgres:16.4
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
secrets:
  db_password:
    file: /etc/example-service/db_password
