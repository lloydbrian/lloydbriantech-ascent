# .ascent/contract.yml: the quality: section (ascent-quality). One project contract,
# one section per ASCENT plugin (decision 2, 2026-10-18; ADR-014, ADR-019,
# ADR-021). Where ASCENT-named files are not allowed, use .claude/contract.yml
# instead. Commit it: it is the project's own statement of test targets, and
# reviews are judged against it.
#
# quality-review proposes this section from what the repository already declares
# and asks the operator to confirm it once (detect, don't ask). Every guessed value
# is marked "# guess" until confirmed. Never put credentials, account ids, email
# addresses, phone numbers or other personal data in this file.

version: 1

quality:
  # enterprise (default) | standard | prototype. Anything the target requires but the
  # project skips is a waiver: an ADR id under waivers below.
  maturity_target: enterprise

  tests:
    # Where the tests live. The checks find test files anywhere by name; these
    # paths are what the review maps and reports.
    paths: [tests/]

    # unit | integration | contract | e2e. Defaults: prototype [unit]; standard
    # [unit, integration]; enterprise [unit, integration], plus e2e when the
    # project has a user interface. check-test-inventory.sh --types takes this list.
    types_required: [unit, integration]

    # Documents that define acceptance criteria (check-tests.sh --criteria). Leave
    # it empty and every Markdown file is read.
    criteria_paths: [docs/]

    # The criterion id format (check-tests.sh --id-pattern), a POSIX extended
    # regular expression. The default is AC-<n>, with an optional .<n>.
    criteria_id_pattern: 'AC-[0-9]+([.][0-9]+)?'

    # Source that holds the core business rules (check-tests.sh --core). Each file
    # must be named by a test. Leave it empty and QA-T4 is "unmeasured".
    core_paths: []

    # The project's own assertion helpers (check-tests.sh --helper), for test
    # runners the checks do not know: e.g. assertEqual, check, expectOk.
    assertion_helpers: []

  # Mutation evidence (check-test-evidence.sh, QA-M1–M4). The load-test targets are
  # not here: p95_latency_ms and peak_rps are read from architecture.quality_targets,
  # which ascent-architecture sets, and never copied.
  mutation:
    # The lowest mutation score the tests must reach, in percent (--min-score). It is
    # also the lowest break threshold a tool may set (QA-M2).
    min_score: 60
    # The newest usable report must be no older than this many days (--max-age).
    max_age_days: 90
    # Report files the checks would not find by name (--report), relative to the
    # repository root; never a directory, a glob or a path outside it. Found by name:
    # *mutation.json, *mutations.xml, *mutation-report.* and *mutation-score*, except
    # under target/, build/, dist/ and coverage/: list PIT's target/pit-reports here.
    reports: []

  adr_dir: docs/adr/
  waivers: []
  # waivers:
  #   - id: ADR-021
  #     skips: end-to-end tests until the UI leaves the prototype stage
  #     review_by: 2027-06-30
